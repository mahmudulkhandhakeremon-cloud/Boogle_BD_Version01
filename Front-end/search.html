<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boogle Search Results</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #fff;
            color: #202124;
        }
        /* Top Search Header */
        .search-header {
            display: flex;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #dfe1e5;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo-text {
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            margin-right: 30px;
            letter-spacing: -1px;
        }
        .logo-text span:nth-child(1) { color: #4285f4; }
        .logo-text span:nth-child(2) { color: #ea4335; }
        .logo-text span:nth-child(3) { color: #fbbc05; }
        .logo-text span:nth-child(4) { color: #4285f4; }
        .logo-text span:nth-child(5) { color: #34a853; }
        .logo-text span:nth-child(6) { color: #ea4335; }

        .search-box-container {
            display: flex;
            align-items: center;
            border: 1px solid #dfe1e5;
            box-shadow: none;
            border-radius: 24px;
            width: 600px;
            max-width: 100%;
            padding: 8px 16px;
            background: #fff;
        }
        .search-box-container:hover {
            box-shadow: 0 1px 6px rgba(32,33,36,.28);
        }
        .search-box-container input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 16px;
            background: transparent;
        }
        .search-box-container i {
            color: #5f6368;
            margin-left: 10px;
            cursor: pointer;
        }

        /* Navigation Bar (Only 'All') */
        .nav-tabs {
            display: flex;
            padding-left: 155px;
            border-bottom: 1px solid #dfe1e5;
            background: #fff;
        }
        .nav-tab-item {
            padding: 12px 16px;
            font-size: 14px;
            color: #1a0dab;
            font-weight: bold;
            border-bottom: 3px solid #1a0dab;
            cursor: pointer;
        }

        /* Results Section */
        .results-body {
            padding: 20px 155px;
            max-width: 650px;
        }
        .result-stats {
            font-size: 14px;
            color: #70757a;
            margin-bottom: 20px;
        }
        .result-card {
            margin-bottom: 25px;
        }
        .result-url {
            font-size: 14px;
            color: #202124;
            word-break: break-all;
            margin-bottom: 2px;
        }
        .result-title {
            font-size: 20px;
            color: #1a0dab;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 3px;
        }
        .result-title:hover {
            text-decoration: underline;
        }
        .no-result {
            color: #d93025;
            font-size: 16px;
        }

        @media(max-width: 768px) {
            .search-header { flex-direction: column; align-items: flex-start; gap: 15px; }
            .nav-tabs, .results-body { padding-left: 20px; padding-right: 20px; }
            .search-box-container { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Header with Logo and Search Bar -->
    <div class="search-header">
        <a href="index.html" class="logo-text">
            <span>B</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
        </a>
        <div class="search-box-container">
            <input type="text" id="searchInput" autocomplete="off">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
    </div>

    <!-- Filter Menu (Only 'All') -->
    <div class="nav-tabs">
        <div class="nav-tab-item">All</div>
    </div>

    <!-- Main Results Area -->
    <div class="results-body">
        <div class="result-stats" id="resultStats">About results</div>
        <div id="resultsContainer">
            <p>Loading...</p>
        </div>
    </div>

    <script>
        // URL থেকে কুয়েরি রিড করা
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q');
        const searchInput = document.getElementById('searchInput');

        if (query) {
            searchInput.value = query;
            
            // FastAPI থেকে ডেটা ফেচ করা
            fetch(`http://127.000.1:8000/search?q=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(data => {
                    const resultsContainer = document.getElementById('resultsContainer');
                    const resultStats = document.getElementById('resultStats');
                    resultsContainer.innerHTML = '';

                    if (data.results && data.results.length > 0) {
                        resultStats.textContent = `About ${data.results.length} results`;
                        
                        data.results.forEach(item => {
                            const div = document.createElement('div');
                            div.className = 'result-card';
                            div.innerHTML = `
                                <div class="result-url">${item['URL']}</div>
                                <a href="${item['URL']}" target="_blank" class="result-title">${item['Website Name']}</a>
                            `;
                            resultsContainer.appendChild(div);
                        });
                    } else {
                        resultStats.textContent = `About 0 results`;
                        resultsContainer.innerHTML = `<p class="no-result">No matching results found for "<strong>${query}</strong>"</p>`;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('resultsContainer').innerHTML = `<p class="no-result">Could not connect to FastAPI server!</p>`;
                });
        }

        // সার্চ বারে নতুন কিছু লিখে এন্টার প্রেস করলে আবার সার্চ হবে
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const newQuery = searchInput.value.trim();
                if (newQuery) {
                    window.location.href = `search.html?q=${encodeURIComponent(newQuery)}`;
                }
            }
        });
    </script>
</body>
</html>
